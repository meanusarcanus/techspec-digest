<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="45%" stop-color="#047857" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="leafGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="goldGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow512" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad512)" />

  <!-- Subtle glow rings -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.2" stroke-dasharray="18 14"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="#34d399" stroke-width="2" stroke-opacity="0.15" />

  <!-- Botanical Sprout Leaf Group -->
  <g filter="url(#shadow512)" transform="translate(42, 32)">
    <!-- Main Big Leaf -->
    <path d="M214 360 C 214 360, 214 225, 94 160 C 94 290, 174 360, 214 360 Z" fill="url(#leafGrad512)" />
    <!-- Secondary Right Leaf -->
    <path d="M214 360 C 214 360, 226 255, 334 200 C 334 305, 254 360, 214 360 Z" fill="#6ee7b7" opacity="0.92" />
    <!-- Center Vein -->
    <path d="M214 360 Q 200 255 134 186" fill="none" stroke="#065f46" stroke-width="8" stroke-linecap="round" />
    <path d="M214 305 Q 254 268 294 235" fill="none" stroke="#065f46" stroke-width="6.5" stroke-linecap="round" />
  </g>

  <!-- Doctor / Plant Clinic Cross Badge -->
  <g transform="translate(336, 85)" filter="url(#shadow512)">
    <circle cx="44" cy="44" r="48" fill="#ffffff" />
    <rect x="36" y="16" width="16" height="56" rx="5" fill="#059669" />
    <rect x="16" y="36" width="56" height="16" rx="5" fill="#059669" />
  </g>

  <!-- Golden Sparkle Accents -->
  <path d="M112 108 L 120 128 L 140 136 L 120 144 L 112 164 L 104 144 L 84 136 L 104 128 Z" fill="url(#goldGrad512)" opacity="0.95" />
  <path d="M370 380 L 375 394 L 389 400 L 375 406 L 370 420 L 365 406 L 351 400 L 365 394 Z" fill="url(#goldGrad512)" opacity="0.8" />
</svg>
