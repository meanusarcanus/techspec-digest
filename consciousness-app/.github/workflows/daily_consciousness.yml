name: Autonomous Daily Consciousness Post Engine

on:
  schedule:
    # Runs automatically every day at 00:00 UTC (Midnight)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target Date (YYYY-MM-DD) or "today"'
        required: false
        default: 'today'

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Dynamic Daily Article & Amazon Product Generator
        run: |
          cd consciousness-app
          TODAY_DATE=$(date -u +'%Y-%m-%d')
          python3 scripts/generate_daily_post.py "$TODAY_DATE"

      - name: Commit and Push Daily Post to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add consciousness-app/data/posts/
          if git diff --staged --quiet; then
            echo "No new daily post changes to commit."
          else
            git commit -m "auto(content): publish daily consciousness article & Amazon product [skip ci]"
            git push origin HEAD:main
          fi
