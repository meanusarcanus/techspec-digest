name: Autonomous Programmatic Content Engine & Publisher

on:
  push:
    branches:
      - main
  schedule:
    # Runs 3 times per week: Monday, Wednesday, Friday at 08:00 UTC
    - cron: '0 8 * * 1,3,5'
  workflow_dispatch:
    inputs:
      target_niche:
        description: 'Specific Niche ID to execute (or "all")'
        required: false
        default: 'all'
      posts_per_niche:
        description: 'Number of posts to generate per niche'
        required: false
        default: '1'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install Hugo CLI
        run: |
          HUGO_VERSION=0.125.4
          wget https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz
          tar -xzf hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz
          sudo mv hugo /usr/local/bin/
          hugo version

      - name: Run Multi-Agent Programmatic Content Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET="${{ github.event.inputs.target_niche || 'all' }}"
          COUNT="${{ github.event.inputs.posts_per_niche || '1' }}"
          python -m agent_engine.orchestrator --niche "$TARGET" --count "$COUNT"

      - name: Commit and Push Generated Content to GitHub Repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check for changes in content directories
          if [[ -n $(git status --porcelain content/) ]]; then
            git add content/
            git commit -m "auto(content): publish scheduled programmatic affiliate post [skip ci]"
            git push origin HEAD:${{ github.ref }}
          else
            echo "No new content changes to commit."
          fi

      - name: Build Static Site with Hugo
        run: |
          hugo --minify

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
