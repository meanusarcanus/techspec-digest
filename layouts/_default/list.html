{{ define "main" }}
<h1 style="font-size: 2rem; font-weight: 800; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem;">
  {{ .Title }}
</h1>

<div style="margin-bottom: 2rem;">
  <input type="text" id="guideSearch" placeholder="Search guides, products (e.g. YubiKey, EcoFlow, Tailscale)..." style="width: 100%; padding: 0.85rem 1.25rem; font-size: 1rem; border-radius: 8px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text); outline: none; margin-bottom: 1rem;">
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; margin-top: 1.5rem;" id="guidesGrid">
  {{ range .Site.RegularPages }}
    <article class="guide-card" data-title="{{ .Title | lower }}" data-category="{{ with .Params.categories }}{{ index . 0 | lower }}{{ end }}" data-desc="{{ .Description | lower }}" style="background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; display: flex; flex-direction: column; justify-content: space-between;">
      <div>
        <span style="font-size: 0.75rem; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.05em;">
          {{ with .Params.categories }}{{ index . 0 }}{{ else }}Guide{{ end }}
        </span>
        <h3 style="font-size: 1.15rem; margin: 0.5rem 0; font-weight: 700; line-height: 1.4;">
          <a href="{{ .RelPermalink }}" style="color: var(--text);">{{ .Title }}</a>
        </h3>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem;">
          {{ .Description | truncate 120 }}
        </p>
      </div>
      <div style="font-size: 0.8rem; color: var(--text-muted); display: flex; justify-content: space-between; border-top: 1px solid var(--border); padding-top: 0.75rem; margin-top: 0.5rem;">
        <span>{{ .Date.Format "Jan 2, 2006" }}</span>
        <a href="{{ .RelPermalink }}" style="font-weight: 600;">Read Guide &rarr;</a>
      </div>
    </article>
  {{ end }}
</div>

<script>
  document.getElementById('guideSearch')?.addEventListener('input', function(e) {
    const query = e.target.value.toLowerCase().trim();
    const cards = document.querySelectorAll('.guide-card');
    cards.forEach(card => {
      const title = card.getAttribute('data-title') || '';
      const cat = card.getAttribute('data-category') || '';
      const desc = card.getAttribute('data-desc') || '';
      if (title.includes(query) || cat.includes(query) || desc.includes(query)) {
        card.style.display = 'flex';
      } else {
        card.style.display = 'none';
      }
    });
  });
</script>
{{ end }}
