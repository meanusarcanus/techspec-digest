          <strong style="color: #0f172a; font-size: 0.9rem; display: block;">Emergency EV Range Charging (240V)</strong>

<script>
(function() {
  const systems = {
    "ecoflow-delta-pro-ultra": {
      name: "EcoFlow DELTA Pro Ultra",
      brand: "EcoFlow",
      tagline: "Best Overall Whole-Home Backup & 240V Heavy Loads",
      baseKwh: 6.1,
      maxKwh: 90,
      continuousW: 7200,
      surgeW: 10800,
      price: "~$4,999",
      priceNum: 4999,
      slug: "ecoflow-delta-pro-ultra",
      badge: "⭐ Recommended Champion",
      pros: "True native 120V/240V split-phase from 1 unit. 7.2kW output runs 3-ton AC + well pumps. 0ms online UPS."
    },
    "bluetti-ep900": {
      name: "Bluetti EP900 + B500",
      brand: "Bluetti",
      tagline: "Best IP65 Outdoor Weather-Sealed System",
      baseKwh: 9.9,
      maxKwh: 19.8,
      continuousW: 9000,
      surgeW: 15000,
      price: "~$7,999",
      priceNum: 7999,
      slug: "bluetti-ep900",
      badge: "Outdoor Rated Pick",
      pros: "IP65 weather-rated for exterior walls. 9.0kW continuous output with net-metering grid sellback."
    },
    "tesla-powerwall-3": {
      name: "Tesla Powerwall 3",
      brand: "Tesla",
      tagline: "Best Fully-Integrated Rooftop Solar System",
      baseKwh: 13.5,
      maxKwh: 40.5,
      continuousW: 11500,
      surgeW: 18500,
      price: "~$8,400",
      priceNum: 8400,
      slug: "tesla-powerwall-3",
      badge: "Maximum Output Pick",
      pros: "11.5 kW continuous output with integrated 6-MPPT solar inverter for complete new solar installs."
    },
    "ecoflow-delta-pro": {
      name: "EcoFlow DELTA Pro (3.6 kWh)",
      brand: "EcoFlow",
      tagline: "Best Entry-Level / Essential Load Backup",
      baseKwh: 3.6,
      maxKwh: 25,
      continuousW: 3600,
      surgeW: 7200,
      price: "~$2,499",
      priceNum: 2499,
      slug: "ecoflow-delta-pro",
      badge: "Best Value Essential Pick",
      pros: "Sub-$2,500 portable powerhouse. Wheels and luggage handle. Runs all critical 120V appliances."
    }
  };

  function calculate() {
    const durationHours = parseInt(document.getElementById('calc-duration').value, 10);
    const solarWatts = parseInt(document.getElementById('calc-solar').value, 10);
    
    let totalContinuousW = 0;
    let maxSurgeW = 0;
    let dailyKwh = 0;
    let requires240V = false;

    const checkboxes = document.querySelectorAll('.app-check:checked');
    checkboxes.forEach(cb => {
      const power = parseInt(cb.getAttribute('data-power'), 10);
      const kwh = parseFloat(cb.getAttribute('data-kwh'));
      const surge = parseInt(cb.getAttribute('data-surge'), 10);
      const is240 = cb.getAttribute('data-requires240') === 'true';

      totalContinuousW += power;
      if (surge > maxSurgeW) maxSurgeW = surge;
      dailyKwh += kwh;
      if (is240) requires240V = true;
    });

    if (totalContinuousW === 0) {
      totalContinuousW = 200;
      dailyKwh = 2.0;
      maxSurgeW = 400;
    }

    // Solar daily contribution (assume 4.5 peak sun hours)
    const dailySolarKwh = (solarWatts * 4.5) / 1000;
    const netDailyKwh = Math.max(0.5, dailyKwh - dailySolarKwh);
    const totalKwhNeeded = (netDailyKwh * (durationHours / 24));

    // Select recommendation
    let recommendedKey = "ecoflow-delta-pro-ultra";
    let extraPacksNeeded = 0;

    if (!requires240V && totalContinuousW <= 3600 && totalKwhNeeded <= 7.2) {
      recommendedKey = "ecoflow-delta-pro";
      extraPacksNeeded = Math.max(0, Math.ceil((totalKwhNeeded - 3.6) / 3.6));
    } else {
      recommendedKey = "ecoflow-delta-pro-ultra";
      extraPacksNeeded = Math.max(0, Math.ceil((totalKwhNeeded - 6.1) / 6.1));
    }

    const rec = systems[recommendedKey];
    const totalInstalledCapacity = (rec.baseKwh + (extraPacksNeeded * rec.baseKwh)).toFixed(1);
    const taxCreditSavings = Math.round(rec.priceNum * 0.30);
    const netPrice = rec.priceNum - taxCreditSavings;

    renderResults({
      durationHours,
      totalContinuousW,
      maxSurgeW,
      dailyKwh: dailyKwh.toFixed(1),
      dailySolarKwh: dailySolarKwh.toFixed(1),
      totalKwhNeeded: totalKwhNeeded.toFixed(1),
      requires240V,
      rec,
      extraPacksNeeded,
      totalInstalledCapacity,
      taxCreditSavings,
      netPrice
    });
  }

  function renderResults(data) {
    const resultsContainer = document.getElementById('battery-calc-results');
    
    resultsContainer.innerHTML = `
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1rem; border-bottom: 1px solid #334155; padding-bottom: 1.25rem; margin-bottom: 1.5rem;">
        <div>
          <span style="background: #2563eb; color: #ffffff; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; padding: 0.25rem 0.75rem; border-radius: 9999px; display: inline-block;">
            ${data.rec.badge}
          </span>
          <h3 style="font-size: 1.6rem; font-weight: 800; color: #ffffff; margin: 0.5rem 0 0 0;">
            ${data.rec.name}
          </h3>
          <p style="color: #94a3b8; font-size: 0.9rem; margin: 0.25rem 0 0 0;">
            ${data.rec.tagline}
          </p>
        </div>
        <div style="text-align: right;">
          <div style="font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; font-weight: 700;">Base Bundle Price</div>
          <div style="font-size: 1.85rem; font-weight: 900; color: #38bdf8;">${data.rec.price}</div>
          <div style="font-size: 0.75rem; color: #34d399; font-weight: 700;">30% Clean Energy Credit: -$${data.taxCreditSavings.toLocaleString()} (Net ~$${data.netPrice.toLocaleString()})</div>
        </div>
      </div>

      <!-- Electrical Specs Grid -->
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 1.5rem;">
        <div style="background: rgba(15, 23, 42, 0.6); padding: 1rem; border-radius: 12px; border: 1px solid #334155;">
          <div style="font-size: 0.7rem; color: #94a3b8; text-transform: uppercase; font-weight: 700;">Continuous Load</div>
          <div style="font-size: 1.25rem; font-weight: 800; color: #ffffff; margin-top: 0.25rem;">${(data.totalContinuousW / 1000).toFixed(2)} kW</div>
          <div style="font-size: 0.75rem; color: #64748b;">Hardware capacity: ${(data.rec.continuousW / 1000).toFixed(1)} kW</div>
        </div>

        <div style="background: rgba(15, 23, 42, 0.6); padding: 1rem; border-radius: 12px; border: 1px solid #334155;">
          <div style="font-size: 0.7rem; color: #94a3b8; text-transform: uppercase; font-weight: 700;">Peak Inrush Surge</div>
          <div style="font-size: 1.25rem; font-weight: 800; color: #f59e0b; margin-top: 0.25rem;">${(data.maxSurgeW / 1000).toFixed(1)} kW</div>
          <div style="font-size: 0.75rem; color: #64748b;">Hardware surge: ${(data.rec.surgeW / 1000).toFixed(1)} kW</div>
        </div>

        <div style="background: rgba(15, 23, 42, 0.6); padding: 1rem; border-radius: 12px; border: 1px solid #334155;">
          <div style="font-size: 0.7rem; color: #94a3b8; text-transform: uppercase; font-weight: 700;">Net Storage Needed</div>
          <div style="font-size: 1.25rem; font-weight: 800; color: #38bdf8; margin-top: 0.25rem;">${data.totalKwhNeeded} kWh</div>
          <div style="font-size: 0.75rem; color: #64748b;">For ${data.durationHours}h blackout</div>
        </div>

        <div style="background: rgba(15, 23, 42, 0.6); padding: 1rem; border-radius: 12px; border: 1px solid #334155;">
          <div style="font-size: 0.7rem; color: #94a3b8; text-transform: uppercase; font-weight: 700;">Recommended Stack</div>
          <div style="font-size: 1.15rem; font-weight: 800; color: #34d399; margin-top: 0.25rem;">${data.totalInstalledCapacity} kWh</div>
          <div style="font-size: 0.75rem; color: #64748b;">1 Inverter + ${data.extraPacksNeeded > 0 ? (data.extraPacksNeeded + 1) + ' Packs' : '1 Base Pack'}</div>
        </div>
      </div>

      <!-- Why It Fits Analysis -->
      <div style="background: #1e293b; border-left: 4px solid #38bdf8; padding: 1.25rem; border-radius: 0 12px 12px 0; margin-bottom: 1.5rem; font-size: 0.95rem; line-height: 1.6; color: #cbd5e1;">
        <strong style="color: #ffffff;">System Sizing Engineering Notes:</strong>
        <p style="margin: 0.35rem 0 0 0;">
          ${data.requires240V ? '⚠️ <strong>240V Split-Phase Circuit Active:</strong> Because you selected heavy inductive loads (Central AC, Well Pump, or EV Charging), your backup system MUST deliver true 240V split-phase power. ' : 'Standard 120V household loads detected. '}
          ${data.rec.pros}
        </p>
      </div>

      <!-- Dual Action: Affiliate Order vs. Local Professional Quote -->
      <div style="display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; justify-content: space-between; margin-bottom: 1.5rem;">
        <div style="font-size: 0.85rem; color: #94a3b8;">
          🔒 Ships with manufacturer direct 5-10 year warranty &amp; official UL9540A safety certifications.
        </div>
        <a href="/go/${data.rec.slug}/" target="_blank" rel="noopener noreferrer" style="background: #0284c7; hover:background: #0369a1; color: #ffffff; font-weight: 800; font-size: 0.95rem; padding: 0.85rem 1.85rem; border-radius: 12px; text-decoration: none; display: inline-block; box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);">
          Check Official ${data.rec.brand} System Pricing &rarr;

      </div>

      <div style="border-top: 1px dashed #334155; padding-top: 1.75rem;">

          <div style="margin-bottom: 1.25rem;">
            <span style="background: rgba(2, 132, 199, 0.2); color: #38bdf8; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; padding: 0.25rem 0.75rem; border-radius: 9999px; display: inline-block; border: 1px solid rgba(56, 189, 248, 0.4); margin-bottom: 0.5rem;">

            </span>
            <h4 style="font-size: 1.35rem; font-weight: 800; color: #ffffff; margin: 0 0 0.35rem 0;">
              Request Free Certified Installer Quotes &amp; Local Tax Rebate Sheet
            </h4>
            <p style="color: #94a3b8; font-size: 0.88rem; margin: 0; line-height: 1.5;">
              Connect with licensed clean energy technicians in your area to assess main electrical panel compatibility, permit filing, and calculate your 30% Federal Clean Energy Tax Credit (estimated <strong>-$${data.taxCreditSavings.toLocaleString()}</strong> savings).
            </p>
          </div>

          <!-- Interactive Quote Form -->
          <form id="ppl-lead-form" onsubmit="window.submitBatteryLead(event)" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem;">
            <input type="hidden" id="lead-system-kwh" value="${data.totalKwhNeeded}">
            <input type="hidden" id="lead-continuous-kw" value="${(data.totalContinuousW / 1000).toFixed(2)}">
            <input type="hidden" id="lead-max-surge-kw" value="${(data.maxSurgeW / 1000).toFixed(1)}">
            <input type="hidden" id="lead-requires-240v" value="${data.requires240V}">
            <input type="hidden" id="lead-recommended-hardware" value="${data.rec.name}">
            <input type="hidden" id="lead-duration-hours" value="${data.durationHours} Hours">
            <input type="hidden" id="lead-tax-savings" value="$${data.taxCreditSavings.toLocaleString()}">

            <div>
              <label style="display: block; font-size: 0.75rem; font-weight: 700; color: #cbd5e1; text-transform: uppercase; margin-bottom: 0.35rem;">
                Your US Zip Code *
              </label>
              <input type="text" id="lead-zip" required pattern="[0-9]{5}" maxlength="5" placeholder="e.g. 78701" style="width: 100%; padding: 0.65rem 0.75rem; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #ffffff; font-size: 0.9rem; font-weight: 600;">
            </div>

            <div>
              <label style="display: block; font-size: 0.75rem; font-weight: 700; color: #cbd5e1; text-transform: uppercase; margin-bottom: 0.35rem;">
                Property Status *
              </label>
              <select id="lead-ownership" style="width: 100%; padding: 0.65rem 0.75rem; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #ffffff; font-size: 0.9rem; font-weight: 600;">
                <option value="Homeowner (Own)" selected>Homeowner (Single Family / Townhouse)</option>
                <option value="Commercial Business">Commercial / Small Business</option>
                <option value="Renter">Renter (Portable / Non-hardwired)</option>

              <input type="text" id="lead-fullname" required placeholder="First &amp; Last Name" style="width: 100%; padding: 0.65rem 0.75rem; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #ffffff; font-size: 0.9rem;">
            </div>

            <div>
              <label style="display: block; font-size: 0.75rem; font-weight: 700; color: #cbd5e1; text-transform: uppercase; margin-bottom: 0.35rem;">
                Email Address *
              </label>
              <input type="email" id="lead-email" required placeholder="you@domain.com" style="width: 100%; padding: 0.65rem 0.75rem; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #ffffff; font-size: 0.9rem;">
            </div>

            <div>
              <label style="display: block; font-size: 0.75rem; font-weight: 700; color: #cbd5e1; text-transform: uppercase; margin-bottom: 0.35rem;">
                Phone Number * (For Quote Sizing)
              </label>
              <input type="tel" id="lead-phone" required placeholder="(555) 000-0000" style="width: 100%; padding: 0.65rem 0.75rem; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #ffffff; font-size: 0.9rem;">
            </div>

            <div style="grid-column: 1 / -1; margin-top: 0.5rem; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1rem;">
              <div style="font-size: 0.78rem; color: #94a3b8; display: flex; align-items: center; gap: 0.6rem;">
                <span>🔒 100% Free Service</span> • <span>Zero Obligation</span> • <span>No Spam Guarantee</span>
              </div>
              <button type="submit" id="ppl-submit-btn" style="background: linear-gradient(135deg, #10b981, #059669); color: #ffffff; font-weight: 800; font-size: 0.95rem; padding: 0.85rem 1.85rem; border-radius: 10px; border: none; cursor: pointer; box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4); transition: transform 0.15s ease;">

          <!-- Success Confirmation Card -->
          <div id="ppl-success-box" style="display: none; background: rgba(16, 185, 129, 0.12); border: 1px solid #10b981; border-radius: 12px; padding: 1.75rem; text-align: center; margin-top: 0.5rem;">
            <div style="font-size: 2rem; margin-bottom: 0.25rem;">✅</div>
            <h4 style="color: #34d399; font-size: 1.35rem; font-weight: 800; margin: 0 0 0.5rem 0;">
              Sizing Specifications Transmitted Successfully!
            </h4>
            <p style="color: #cbd5e1; font-size: 0.92rem; margin: 0; line-height: 1.6; max-width: 580px; margin: 0 auto;">
              Your reference ID is <strong id="ppl-lead-id-display" style="color: #38bdf8; font-family: monospace;"></strong>. A local clean energy specialist serving zip code <strong id="ppl-zip-display" style="color: #facc15;"></strong> has received your <strong><span id="ppl-kwh-display"></span> kWh</strong> load calculations and is preparing your equipment, 240V hookup, and 30% federal tax rebate breakdown.

  }

  // Pay-Per-Lead Submission Handler
  window.submitBatteryLead = async function(e) {
    if (e && e.preventDefault) e.preventDefault();
    const btn = document.getElementById('ppl-submit-btn');
    const originalBtnText = btn ? btn.innerHTML : 'Submit';
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = '⏳ Transmitting Specifications...';
      btn.style.opacity = '0.7';
      btn.style.cursor = 'not-allowed';
    }

    const payload = {
      fullName: document.getElementById('lead-fullname').value,
      email: document.getElementById('lead-email').value,
      phone: document.getElementById('lead-phone').value,
      zip: document.getElementById('lead-zip').value,
      homeOwnership: document.getElementById('lead-ownership').value,
      electricBill: document.getElementById('lead-bill').value,
      systemSizeKwh: document.getElementById('lead-system-kwh').value,
      continuousKw: document.getElementById('lead-continuous-kw').value,
      maxSurgeKw: document.getElementById('lead-max-surge-kw').value,
      requires240V: document.getElementById('lead-requires-240v').value === 'true',
      recommendedHardware: document.getElementById('lead-recommended-hardware').value,
      durationHours: document.getElementById('lead-duration-hours').value,
      taxCreditSavings: document.getElementById('lead-tax-savings').value
    };

    try {
      const response = await fetch('https://garden.theodisius.com/api/quote_request.php', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
      });

      const result = await response.json();

      if (response.ok && result.success) {
        const form = document.getElementById('ppl-lead-form');
        const successBox = document.getElementById('ppl-success-box');
        if (form) form.style.display = 'none';
        if (successBox) {
          document.getElementById('ppl-lead-id-display').textContent = result.leadId || 'CONFIRMED';
          document.getElementById('ppl-zip-display').textContent = result.zip || payload.zip;
          document.getElementById('ppl-kwh-display').textContent = result.systemSizeKwh || payload.systemSizeKwh;
          successBox.style.display = 'block';
        }
      } else {
        alert(result.error || 'There was a problem submitting your request. Please check your details and try again.');
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = originalBtnText;
          btn.style.opacity = '1';
          btn.style.cursor = 'pointer';
        }
      }
    } catch (err) {
      console.error('Lead transmission error:', err);
      alert('Unable to connect to quote server. Please check your connection or contact tednadres@theodisius.com directly.');
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = originalBtnText;
        btn.style.opacity = '1';
        btn.style.cursor = 'pointer';
      }
    }
  };

  // Attach event listeners
  document.getElementById('calc-duration').addEventListener('change', calculate);
  document.getElementById('calc-solar').addEventListener('change', calculate);
  
  const checkboxes = document.querySelectorAll('.app-check');
  checkboxes.forEach(cb => {
    cb.addEventListener('change', calculate);
  });

  // Initial render
  calculate();
})();
</script>
